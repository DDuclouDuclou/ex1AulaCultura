name: Esteira CI/CD Python

on:
  push:
    branches: [main, feature/esteira]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Etapa III - Checkout e Runtime
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Etapa IV - Dependências e Linting
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 app tests --max-line-length=120

      # Etapa V - Testes e Qualidade
      - name: Tests
        run: pytest tests/

      - name: Mypy
        run: mypy app

      # Etapa VI - Gerar e publicar artefato
      - name: Run pipeline
        run: python app/pipeline.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-report
          path: output/summary.csv

  # Etapa VII - Deploy (só roda na main, após validate passar)
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy
        run: echo "Deploy realizado com sucesso!"
